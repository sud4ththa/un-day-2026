<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Draft email preview, not sent</title>
<style>
  body { margin: 0; background: #fff; color: #111; }
  .bar {
    position: sticky;
    top: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 10px 16px;
    background: #fff;
    color: #111;
    border-bottom: 1px solid #111;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.3;
  }
  .bar p { margin: 0; flex: 1 1 12rem; }
  .bar button {
    background: #fff;
    color: #111;
    border: 1px solid #111;
    padding: 6px 10px;
    font: inherit;
    cursor: pointer;
  }
  .bar button:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
  .bar #status { min-width: 4.5rem; }
  .sheet { padding: 28px 16px 64px; }
</style>
</head>
<body>
<div class="bar">
  <p>Draft email preview, not sent</p>
  <button type="button" id="copy-email">Copy email</button>
  <button type="button" id="copy-source">Copy HTML source</button>
  <span id="status" role="status"></span>
</div>
<div class="sheet">
<!-- COPY -->
<p>Final email text coming soon.</p>
<!-- /COPY -->
</div>
<script>
(function () {
  var statusEl = document.getElementById("status");

  function emailEl() {
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_COMMENT);
    var node;
    while ((node = walker.nextNode())) {
      if (node.nodeValue.trim() === "COPY") return node.nextElementSibling;
    }
    return null;
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function selectCopy(el) {
    var range = document.createRange();
    range.selectNode(el);
    var selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    var ok = document.execCommand("copy");
    selection.removeAllRanges();
    if (!ok) throw new Error("copy failed");
  }

  function sourceCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.top = "0";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(area);
    if (!ok) throw new Error("copy failed");
  }

  document.getElementById("copy-email").addEventListener("click", function () {
    var el = emailEl();
    var html = el.outerHTML;
    var text = el.innerText;
    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([
        new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([text], { type: "text/plain" })
        })
      ]).then(function () {
        setStatus("Copied");
      }, function () {
        try {
          selectCopy(el);
          setStatus("Copied");
        } catch (err) {
          setStatus("Copy failed");
        }
      });
      return;
    }
    try {
      selectCopy(el);
      setStatus("Copied");
    } catch (err) {
      setStatus("Copy failed");
    }
  });

  document.getElementById("copy-source").addEventListener("click", function () {
    var html = emailEl().outerHTML;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(html).then(function () {
        setStatus("Copied");
      }, function () {
        try {
          sourceCopy(html);
          setStatus("Copied");
        } catch (err) {
          setStatus("Copy failed");
        }
      });
      return;
    }
    try {
      sourceCopy(html);
      setStatus("Copied");
    } catch (err) {
      setStatus("Copy failed");
    }
  });
})();
</script>
</body>
</html>
