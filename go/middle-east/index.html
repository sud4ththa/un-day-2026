<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: #fff;
    color: #111;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: 3.5rem 1.75rem 2rem;
  }
  .logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    margin: 0 0 2.75rem;
  }
  .logos img { display: block; height: 56px; width: auto; }
  .logos .rule { width: 1px; height: 40px; background: #111; opacity: 0.2; }
  .kicker {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin: 0 0 1.25rem;
    padding-left: 0.28em;
  }
  h1 {
    font-weight: normal;
    font-size: clamp(2.25rem, 9vw, 3.75rem);
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 0 0 1.25rem;
    text-wrap: balance;
  }
  .detail {
    font-style: italic;
    font-size: 1.15rem;
    line-height: 1.45;
    margin: 0;
  }
  .status {
    margin-top: 3rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .lead { font-size: 0.95rem; letter-spacing: 0.01em; margin: 0; }
  .sub { font-size: 0.85rem; color: #555; margin: 0.5rem 0 0; }
  .bar {
    width: 8.5rem;
    height: 1px;
    margin: 1.1rem auto 0;
    background: rgba(17, 17, 17, 0.12);
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    background: #111;
    transform: scaleX(0);
    transform-origin: left center;
    animation: fill 1.6s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
  }
  @keyframes fill { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .bar span { animation: none; transform: scaleX(0.6); }
  }
  .actions { margin: 1.75rem 0 0; }
  a.continue {
    font-size: 0.85rem;
    color: #111;
    text-decoration: none;
    border-bottom: 1px solid rgba(17, 17, 17, 0.35);
    padding-bottom: 0.1rem;
  }
  a.continue:hover, a.continue:focus { border-bottom-color: #111; }
  ul.stalls {
    list-style: none;
    padding: 0;
    margin: 2rem auto 0;
    max-width: 22rem;
    text-align: left;
  }
  ul.stalls li { border-top: 1px solid #111; }
  ul.stalls li:last-child { border-bottom: 1px solid #111; }
  ul.stalls a {
    display: block;
    padding: 0.85rem 0;
    color: #111;
    text-decoration: none;
  }
  footer {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    color: #666;
    text-align: center;
    padding: 0 1.5rem 1.75rem;
  }
  @media (min-width: 48rem) {
    .logos { gap: 2rem; margin-bottom: 3.25rem; }
    .logos img { height: 68px; }
    .logos .rule { height: 48px; }
    .detail { font-size: 1.25rem; }
  }
</style>
